# Copy to cover_letter.yaml, or use Edit → Edit cover letter… in the app.
# Each paragraph is a list of text runs. Keep the runs small and readable;
# the GUI writes the same structure when the letter is saved.
paragraphs:
  - runs:
      - text: "Dear Hiring Manager,"
  - runs:
      - text: "I am writing to apply for the "
      - text: "role title"
        bold: true
      - text: " position."
  - runs:
      - text: "Add your letter here. Use "
      - text: "italic"
        italic: true
      - text: " for emphasis or a larger "
      - text: "size"
        size: 14
      - text: " to make a line stand out."
  - runs:
      - text: "Sincerely,"
  - runs:
      - text: "Your Name"
